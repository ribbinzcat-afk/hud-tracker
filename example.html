<div class="hud-tracker-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>HUD Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="hud_tracker_enabled" type="checkbox" />
                <label for="hud_tracker_enabled">Enable HUD Tracker</label>
            </div>

            <hr>

            <!-- เพิ่มส่วนจัดการ Preset ตรงนี้ -->
            <div id="hud_tracker_preset_container" style="margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.1); border-radius: 5px;">
                <label><b>Preset:</b></label>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <select id="hud_tracker_preset_select" class="text_pole" style="flex-grow: 1;"></select>

                    <!-- เพิ่มปุ่ม ลบ, ส่งออก, นำเข้า -->
                    <div id="hud_tracker_delete_preset" class="menu_button fa-solid fa-trash" title="Delete Preset" style="margin: 0; display: flex; align-items: center; justify-content: center; width: 40px;"></div>
                    <div id="hud_tracker_export_preset" class="menu_button fa-solid fa-file-export" title="Export Preset" style="margin: 0; display: flex; align-items: center; justify-content: center; width: 40px;"></div>
                    <div id="hud_tracker_import_preset_btn" class="menu_button fa-solid fa-file-import" title="Import Preset" style="margin: 0; display: flex; align-items: center; justify-content: center; width: 40px;"></div>
                    <!-- เปลี่ยนจาก accept=".json" เป็นแบบนี้แทน -->
                    <input type="file" id="hud_tracker_import_file" style="display: none;" accept=".json,application/json,text/plain,*/*" />
                </div>
                <div style="display: flex; gap: 5px;">
                    <input id="hud_tracker_new_preset_name" type="text" class="text_pole" placeholder="New preset name" style="flex-grow: 1;" />
                    <div id="hud_tracker_save_preset" class="menu_button fa-solid fa-save" title="Save as New Preset" style="margin: 0; display: flex; align-items: center; justify-content: center; width: 40px;"></div>
                </div>
            </div>
            <!-- สิ้นสุดส่วนจัดการ Preset -->
            
            <!-- เพิ่มส่วนนี้สำหรับการ Custom ข้อความ -->
            <div>
                <label for="hud_tracker_header_template"><b>ส่วนที่แสดงผลตลอด (Header):</b></label>
                <input id="hud_tracker_header_template" type="text" class="text_pole" style="width: 100%; margin-bottom: 10px;" placeholder="เช่น: HP: 100 | MP: 50" />
            </div>
            <div>
                <label for="hud_tracker_content_template"><b>ส่วนที่ซ่อนไว้ (Collapse Content):</b></label>
                <textarea id="hud_tracker_content_template" class="text_pole" rows="3" style="width: 100%; resize: vertical;" placeholder="เช่น: สถานะผิดปกติ: ไม่มี\nความสัมพันธ์: ระดับ 2"></textarea>
            </div>
            <!-- สิ้นสุดส่วนที่เพิ่ม -->

            <hr>
            <div>
                <input id="hud_tracker_test_button" class="menu_button" type="submit" value="Test Button" />
            </div>
            <p><small>Toggle this and refresh - it should remember your choice.</small></p>
        </div>
    </div>
</div>
